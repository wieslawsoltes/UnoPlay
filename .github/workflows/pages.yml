name: Build and publish
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify portable libraries
        run: |
          dotnet run -c Release --project tests/Core.Tests
          dotnet run -c Release --project tests/ClassicSkins.Tests
          dotnet run -c Release --project tests/Metadata.Tests -- src/UnoPlay.App/Assets/Media/first-light.mp3
      - run: dotnet publish src/UnoPlay.App -c Release -f net10.0-browserwasm -p:UnoPlayTarget=net10.0-browserwasm -o "${{ runner.temp }}/browser"
      - name: Test published browser application
        shell: bash
        run: |
          site="${{ runner.temp }}/browser/wwwroot"
          test -f "$site/index.html" && test -f "$site/media/first-light.mp3"
          npm ci --prefix tests/browser
          (cd tests/browser && npx playwright install --with-deps chromium)
          node tests/browser/app.cjs "$site"
      - name: Verify media decoding and DSP
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          NODE_PATH="$PWD/tests/browser/node_modules" node tests/media/playback.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/browser/wwwroot
  deploy:
    needs: browser
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Deploy
        id: publish
        uses: actions/deploy-pages@v4
