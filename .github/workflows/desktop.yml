name: Desktop packages and releases

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve release version
        id: version
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          MANUAL_RELEASE: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          number='(0|[1-9][0-9]*)'
          [[ $version =~ ^$number\.$number\.$number$ ]] || { echo "Invalid stable version: $version"; exit 1; }
          tag="v$version"
          publish=false
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            [[ $GITHUB_REF_NAME == "$tag" ]] || { echo "Tag must match VERSION ($tag)"; exit 1; }
            publish=true
          elif [[ $GITHUB_REF == refs/heads/main ]]; then
            if [[ $MANUAL_RELEASE == true ]]; then
              publish=true
            elif [[ $GITHUB_EVENT_NAME == push ]]; then
              if [[ $BEFORE =~ ^0+$ ]]; then BEFORE=$(git hash-object -t tree /dev/null); fi
              if git diff --quiet "$BEFORE" "$GITHUB_SHA" -- VERSION; then
                publish=false
              else
                result=$?
                [[ $result == 1 ]] || exit "$result"
                publish=true
              fi
            fi
          elif [[ $MANUAL_RELEASE == true ]]; then
            echo "Publish from main or a matching release tag"; exit 1
          fi
          if [[ $publish == true ]]; then test -s "releases/$tag.md"; fi
          printf 'tag=%s\npublish=%s\n' "$tag" "$publish" >> "$GITHUB_OUTPUT"

  package:
    needs: version
    concurrency:
      group: desktop-${{ matrix.rid }}-${{ needs.version.outputs.publish == 'true' && github.run_id || github.ref }}
      cancel-in-progress: ${{ needs.version.outputs.publish != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, rid: linux-x64 }
          - { os: windows-latest, rid: win-x64 }
          - { os: macos-15, rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify native Windows cursor handles
        if: runner.os == 'Windows'
        run: dotnet run --project tests/Win32Cursors.Tests -c Release
      - name: Verify Spotify authorization and loopback callbacks
        run: |
          dotnet run --project tests/Spotify.Tests -c Release
          dotnet run --project tests/Spotify.Platform.Tests -c Release
      - name: Publish self-contained desktop application
        run: dotnet publish src/UnoPlay.App -c Release -f net10.0-desktop -p:UnoPlayTarget=net10.0-desktop -r ${{ matrix.rid }} --self-contained -o dist/UnoPlay
      - name: Package with executable permissions
        if: runner.os != 'Windows'
        run: tar -C dist -czf UnoPlay-${{ matrix.rid }}.tar.gz UnoPlay
      - name: Package Windows binaries
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/UnoPlay -DestinationPath UnoPlay-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: UnoPlay-${{ matrix.rid }}
          path: UnoPlay-${{ matrix.rid }}.*
          if-no-files-found: error

  release:
    needs: [version, package]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.version.outputs.tag }}
      cancel-in-progress: false
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: UnoPlay-*
          merge-multiple: true
          path: packages
      - name: Verify the three archives and generate checksums
        run: |
          python3 tools/verify_desktop_packages.py packages
          cd packages
          sha256sum UnoPlay-* > SHA256SUMS
      - name: Publish the verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/publish_release.sh
